[package]
name = "habitglo"
version = "0.1.0"
description = "HabitGlo desktop shell"
authors = ["HabitGlo"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.6", features = [ "api-all",
    "window-current-monitor"
] }
