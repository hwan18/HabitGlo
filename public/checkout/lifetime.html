<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitGlo Lifetime Checkout</title>
  <script src="/download/config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --panel: #121522;
      --text: #eef2ff;
      --muted: #9ea8c7;
      --accent: #36d2ff;
      --accent-2: #6bff6b;
      --warn-bg: #2f2512;
      --warn-border: #6f5a23;
      --warn-text: #ffe4a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #112331 0%, var(--bg) 52%);
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      border: 1px solid #2a2f42;
      border-radius: 16px;
      background: linear-gradient(180deg, #161b2f, var(--panel));
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .price { margin: 0 0 14px; color: #d5ddff; font-weight: 600; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
    .status {
      margin-top: 14px;
      border: 1px solid #2d3552;
      border-radius: 10px;
      background: #0f1426;
      padding: 10px 12px;
      color: #d4dbf7;
      font-size: 0.95rem;
    }
    .status.warn {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      border: 1px solid #2d3552;
      color: var(--text);
    }
    .primary {
      border: none;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #03040a;
    }
    code {
      background: #0d1120;
      border: 1px solid #2a2f42;
      border-radius: 6px;
      padding: 2px 6px;
      color: #d7deff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Lifetime Plan Checkout</h1>
    <p class="price">$29 one-time</p>
    <p>
      This endpoint forwards users from pricing to your payment provider.
      Set <code>checkout.lifetimeUrl</code> in <code>public/download/config.js</code>.
    </p>
    <p id="status" class="status">Loading checkout link...</p>
    <div class="actions">
      <a id="checkout-link" class="primary" href="/download/windows.html?plan=lifetime">Continue</a>
      <a href="/download/windows.html?plan=lifetime">Skip to Download Page</a>
      <a href="/pricing">Back to Pricing</a>
    </div>
  </main>
  <script>
    (function () {
      const config = window.HABITGLO_WEBSITE_CONFIG || {};
      const lifetimeUrl = config.checkout && typeof config.checkout.lifetimeUrl === 'string'
        ? config.checkout.lifetimeUrl.trim()
        : '';
      const checkoutLink = document.getElementById('checkout-link');
      const status = document.getElementById('status');

      if (lifetimeUrl) {
        checkoutLink.href = lifetimeUrl;
        checkoutLink.textContent = 'Continue to Secure Checkout';
        status.textContent = 'Lifetime checkout link is configured. Continue to payment.';
        return;
      }

      checkoutLink.href = '/download/windows.html?plan=lifetime';
      checkoutLink.textContent = 'Checkout URL Missing - Open Download';
      status.classList.add('warn');
      status.innerHTML = 'No lifetime checkout URL configured. Set <code>checkout.lifetimeUrl</code> in <code>public/download/config.js</code>.';
    })();
  </script>
</body>
</html>
