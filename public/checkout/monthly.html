<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitGlo Monthly Checkout</title>
  <script src="/download/config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --panel: #121522;
      --text: #eef2ff;
      --muted: #9ea8c7;
      --accent: #ff5ad9;
      --accent-2: #36d2ff;
      --warn-bg: #2f2512;
      --warn-border: #6f5a23;
      --warn-text: #ffe4a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1a1031 0%, var(--bg) 52%);
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      border: 1px solid #2a2f42;
      border-radius: 16px;
      background: linear-gradient(180deg, #161b2f, var(--panel));
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .price { margin: 0 0 14px; color: #d5ddff; font-weight: 600; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
    .status {
      margin-top: 14px;
      border: 1px solid #2d3552;
      border-radius: 10px;
      background: #0f1426;
      padding: 10px 12px;
      color: #d4dbf7;
      font-size: 0.95rem;
    }
    .status.warn {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      border: 1px solid #2d3552;
      color: var(--text);
    }
    .primary {
      border: none;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #03040a;
    }
    code {
      background: #0d1120;
      border: 1px solid #2a2f42;
      border-radius: 6px;
      padding: 2px 6px;
      color: #d7deff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Monthly Plan Checkout</h1>
    <p class="price">$4/month</p>
    <p>
      Start secure checkout directly with Paddle.
      Set <code>paddle.clientToken</code> and <code>paddle.prices.monthly</code> in <code>public/download/config.js</code>.
    </p>
    <p id="status" class="status">Loading checkout configuration...</p>
    <div class="actions">
      <a id="checkout-link" class="primary" href="#">Continue to Secure Checkout</a>
      <a id="purchase-link" href="/purchase?plan=monthly&source=website_checkout">Sign In First</a>
      <a href="/download/windows.html?plan=monthly">Skip to Download Page</a>
      <a href="/pricing">Back to Pricing</a>
    </div>
  </main>
  <script>
    (function () {
      const plan = 'monthly';
      const config = window.HABITGLO_WEBSITE_CONFIG || {};
      const paddle = config.paddle && typeof config.paddle === 'object' ? config.paddle : {};
      const prices = paddle.prices && typeof paddle.prices === 'object' ? paddle.prices : {};
      const environment = typeof paddle.environment === 'string'
        ? paddle.environment.trim().toLowerCase()
        : 'production';
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientToken = typeof paddle.clientToken === 'string'
        ? paddle.clientToken.trim()
        : '';
      const priceId = typeof prices.monthly === 'string'
        ? prices.monthly.trim()
        : '';
      const isLiveToken = clientToken.indexOf('live_') === 0;
      const isTestToken = clientToken.indexOf('test_') === 0;
      const isProductionOnLocalhost = isLocalhost && environment === 'production';
      const hasEnvironmentTokenMismatch =
        (environment === 'production' && isTestToken) ||
        (environment === 'sandbox' && isLiveToken);
      const queryParams = new URLSearchParams(window.location.search);
      const rawUserId =
        queryParams.get('uid') ||
        queryParams.get('user_id') ||
        queryParams.get('supabase_user_id') ||
        '';
      const rawEmail = queryParams.get('email') || '';
      const rawSource = queryParams.get('source') || '';
      const checkoutLink = document.getElementById('checkout-link');
      const purchaseLink = document.getElementById('purchase-link');
      const status = document.getElementById('status');
      const scriptUrl = 'https://cdn.paddle.com/paddle/v2/paddle.js';

      const setWarning = function (message) {
        status.classList.add('warn');
        status.textContent = message;
      };

      const setStatus = function (message) {
        status.classList.remove('warn');
        status.textContent = message;
      };

      const disableCheckout = function (message) {
        setWarning(message);
        checkoutLink.textContent = 'Checkout Unavailable';
        checkoutLink.setAttribute('aria-disabled', 'true');
        checkoutLink.style.pointerEvents = 'none';
        checkoutLink.style.opacity = '0.55';
      };

      const toMessageText = function (value) {
        return typeof value === 'string' && value.trim()
          ? value.trim()
          : '';
      };

      const isUuid = function (value) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
      };

      const userId = isUuid(toMessageText(rawUserId))
        ? toMessageText(rawUserId).toLowerCase()
        : '';
      const customerEmail = toMessageText(rawEmail);
      const checkoutSource = toMessageText(rawSource) || 'website_checkout';

      if (purchaseLink) {
        const purchaseParams = new URLSearchParams({ plan: plan, source: checkoutSource });
        purchaseLink.href = '/purchase?' + purchaseParams.toString();
      }

      if (toMessageText(rawUserId) && !userId) {
        console.warn('[Paddle checkout] Ignoring invalid supabase_user_id query parameter.');
      }

      if (!userId) {
        disableCheckout('Sign in first to link purchase to your account.');
        return;
      }

      const getEventName = function (eventData) {
        if (!eventData || typeof eventData !== 'object') return '';
        if (typeof eventData.name === 'string') return eventData.name.toLowerCase();
        if (typeof eventData.eventName === 'string') return eventData.eventName.toLowerCase();
        if (typeof eventData.event_name === 'string') return eventData.event_name.toLowerCase();
        return '';
      };

      const getCheckoutFailureMessage = function (eventData) {
        if (!eventData || typeof eventData !== 'object') {
          return 'See browser console for details.';
        }

        const details = [];
        const pushDetail = function (key, value) {
          const text = toMessageText(value);
          if (text) details.push(key + ': ' + text);
        };

        const error = eventData.error && typeof eventData.error === 'object'
          ? eventData.error
          : null;
        const data = eventData.data && typeof eventData.data === 'object'
          ? eventData.data
          : null;

        if (error) {
          pushDetail('code', error.code);
          pushDetail('detail', error.detail);
          pushDetail('message', error.message);
        }
        if (data) {
          pushDetail('code', data.code);
          pushDetail('detail', data.detail);
          pushDetail('message', data.message);
        }
        pushDetail('code', eventData.code);
        pushDetail('detail', eventData.detail);
        pushDetail('message', eventData.message);

        if (!details.length) {
          return 'See browser console for full Paddle payload.';
        }
        return details.join(' | ');
      };

      const onPaddleEvent = function (eventData) {
        window.HABITGLO_LAST_PADDLE_EVENT = eventData;
        const eventName = getEventName(eventData);
        console.log('[Paddle event]', eventName || 'unknown', eventData);

        if (eventName === 'checkout.failed') {
          setWarning('Paddle checkout failed. ' + getCheckoutFailureMessage(eventData));
          return;
        }

        if (eventName === 'checkout.closed') {
          setStatus('Checkout closed. You can try again.');
          return;
        }

        if (eventName === 'checkout.loaded') {
          setStatus('Checkout loaded. Continue payment in the Paddle overlay.');
          return;
        }

        if (eventName === 'checkout.completed') {
          setStatus('Checkout completed. Redirecting...');
        }
      };

      const loadPaddle = function () {
        return new Promise(function (resolve, reject) {
          if (window.Paddle) {
            resolve(window.Paddle);
            return;
          }
          const existing = document.querySelector('script[src="' + scriptUrl + '"]');
          if (existing) {
            existing.addEventListener('load', function () { resolve(window.Paddle); }, { once: true });
            existing.addEventListener('error', function () { reject(new Error('Failed to load Paddle.js')); }, { once: true });
            return;
          }
          const script = document.createElement('script');
          script.src = scriptUrl;
          script.async = true;
          script.onload = function () { resolve(window.Paddle); };
          script.onerror = function () { reject(new Error('Failed to load Paddle.js')); };
          document.head.appendChild(script);
        });
      };

      let initialized = false;
      const ensurePaddle = async function () {
        const paddleSdk = await loadPaddle();
        if (!paddleSdk || typeof paddleSdk.Initialize !== 'function') {
          throw new Error('Paddle.js did not initialize correctly.');
        }
        if (!initialized) {
          if (environment === 'sandbox' && paddleSdk.Environment && typeof paddleSdk.Environment.set === 'function') {
            paddleSdk.Environment.set('sandbox');
          }
          paddleSdk.Initialize({
            token: clientToken,
            eventCallback: onPaddleEvent,
          });
          initialized = true;
        }
        return paddleSdk;
      };

      if (!clientToken) {
        setWarning('Missing paddle.clientToken in /download/config.js.');
        return;
      }

      if (!priceId) {
        setWarning('Missing paddle.prices.monthly in /download/config.js.');
        return;
      }

      if (isProductionOnLocalhost) {
        disableCheckout('Live Paddle checkout is blocked on localhost. Switch to sandbox for local testing, or use your production HTTPS domain.');
        return;
      }

      if (hasEnvironmentTokenMismatch) {
        disableCheckout('Paddle environment/token mismatch. Use test_ token for sandbox, or live_ token for production.');
        return;
      }

      setStatus('Monthly checkout is ready. Click continue to open Paddle.');

      checkoutLink.addEventListener('click', async function (event) {
        event.preventDefault();
        if (checkoutLink.getAttribute('aria-disabled') === 'true') {
          return;
        }
        setStatus('Opening secure checkout...');
        try {
          const paddleSdk = await ensurePaddle();
          const checkoutSettings = {
            displayMode: 'overlay',
            theme: 'dark',
          };
          if (!isLocalhost) {
            checkoutSettings.successUrl = window.location.origin + '/download/windows.html?plan=' + plan;
          }
          const checkoutData = {
            items: [{ priceId: priceId, quantity: 1 }],
            customData: {
              plan: plan,
              checkout_source: checkoutSource,
              supabase_user_id: userId,
            },
            settings: checkoutSettings,
            ...(customerEmail ? { customer: { email: customerEmail } } : {}),
          };
          paddleSdk.Checkout.open(checkoutData);
          setStatus('Checkout opened. If no overlay appears, check browser console for [Paddle event] logs.');
        } catch (error) {
          const message = error && error.message ? error.message : 'Failed to open checkout.';
          setWarning(message);
        }
      });
    })();
  </script>
</body>
</html>
