<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitGlo Windows Download</title>
  <meta name="theme-color" content="#0d0b09" />
  <link rel="icon" type="image/png" href="/icons/habitglo-logo-32.png" />
  <link rel="apple-touch-icon" href="/icons/habitglo-logo-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/site.css" />
  <script>document.documentElement.classList.add('js')</script>
  <script src="/download/config.js"></script>
</head>
<body class="page pg-download">
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/" aria-label="HabitGlo home">
        <img class="brand-mark" src="/media/led-h.svg" alt="" width="30" height="26" />
        <span class="brand-name">HabitGlo</span>
      </a>
      <a class="back-link back" href="/pricing">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
    </div>
  </header>

  <main class="page-main">
    <div class="wrap split">
      <div class="split-copy">
        <p class="chapter">Windows 10+</p>
        <h1 class="display split-title">Download HabitGlo for <em>Windows</em></h1>
        <p id="greeting" class="lede">Install and run the latest desktop build.</p>
        <div class="mini-sign" aria-hidden="true">
          <canvas data-led='[{"text":"DONE IS BETTER THAN PERFECT"},{"text":"DRINK WATER","color":"green"},{"text":"ONE CONTENT RECORDING BEFORE LUNCH"}]' data-led-rows="9" data-led-speed="16"></canvas>
        </div>
      </div>

      <section class="card panel" aria-label="Installer details">
        <p id="status" class="status">Loading download metadata...</p>
        <dl class="meta">
          <dt>Version</dt>
          <dd id="version">-</dd>
          <dt>File</dt>
          <dd id="filename">-</dd>
          <dt>Minimum OS</dt>
          <dd id="min-os">-</dd>
          <dt>SHA-256</dt>
          <dd id="sha256">-</dd>
        </dl>
        <a id="download-link" class="primary btn btn-primary btn-block" href="#">Download Installer</a>
        <div class="actions secondary-links">
          <a class="ghost-link" href="/">Back to Home</a>
          <a class="ghost-link" href="/pricing">Back to Pricing</a>
          <a class="ghost-link" href="/app?demoReset=1">Try in Browser</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const config = window.HABITGLO_WEBSITE_CONFIG || {};
      const windows = config.download && config.download.windows ? config.download.windows : {};
      const releasePageUrl = typeof windows.releasePageUrl === 'string' && windows.releasePageUrl.trim()
        ? windows.releasePageUrl.trim()
        : 'https://github.com/YOUR_ORG/YOUR_REPO/releases/latest';
      const directUrl = typeof windows.directUrl === 'string' ? windows.directUrl.trim() : '';
      const version = typeof windows.version === 'string' && windows.version.trim() ? windows.version.trim() : 'unknown';
      const fileName = typeof windows.fileName === 'string' && windows.fileName.trim() ? windows.fileName.trim() : 'HabitGlo installer';
      const minOs = typeof windows.minOs === 'string' && windows.minOs.trim() ? windows.minOs.trim() : 'Windows 10+';
      const sha = typeof windows.sha256 === 'string' && windows.sha256.trim() ? windows.sha256.trim() : 'Not published';

      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan');
      const greeting = document.getElementById('greeting');
      if (plan === 'monthly') {
        greeting.textContent = 'Thanks for subscribing. Download the latest Windows build below.';
      } else if (plan === 'lifetime') {
        greeting.textContent = 'Thanks for your lifetime purchase. Download the latest Windows build below.';
      }

      document.getElementById('version').textContent = version;
      document.getElementById('filename').textContent = fileName;
      document.getElementById('min-os').textContent = minOs;
      document.getElementById('sha256').textContent = sha;

      const downloadLink = document.getElementById('download-link');
      const status = document.getElementById('status');

      if (directUrl) {
        downloadLink.href = directUrl;
        status.textContent = 'Direct installer link is configured.';
        return;
      }

      downloadLink.href = releasePageUrl;
      downloadLink.textContent = 'Open Release Page';
      status.classList.add('warn');
      status.innerHTML = 'No direct installer URL configured. Set <code>download.windows.directUrl</code> in <code>public/download/config.js</code>.';
    })();
  </script>
  <script src="/js/led.js" defer></script>
  <script src="/js/site.js" defer></script>
</body>
</html>
