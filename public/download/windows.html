<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitGlo Windows Download</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/app-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/download/config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: 150 80% 4%;
      --foreground: 45 100% 95%;
      --card: 150 70% 8%;
      --popover: 150 70% 8%;
      --primary: 150 100% 48%;
      --accent: 35 100% 58%;
      --glow-blue: 320 100% 70%;
      --border: 45 100% 95%;
      --panel: hsl(var(--card) / 0.84);
      --panel-strong: hsl(var(--popover) / 0.9);
      --card-border: hsl(var(--border) / 0.14);
      --text: hsl(var(--foreground));
      --soft-text: hsl(var(--foreground) / 0.68);
      --muted: hsl(var(--foreground) / 0.46);
      --warn-bg: hsl(var(--accent) / 0.11);
      --warn-border: hsl(var(--accent) / 0.32);
      --warn-text: hsl(var(--foreground) / 0.92);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, hsl(var(--primary) / 0.22), transparent 34%),
        radial-gradient(circle at 84% 12%, hsl(var(--accent) / 0.16), transparent 24%),
        linear-gradient(180deg, hsl(var(--background)), hsl(150 100% 2%));
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(820px, 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background:
        linear-gradient(135deg, hsl(var(--primary) / 0.08), transparent 38%),
        linear-gradient(315deg, hsl(var(--glow-blue) / 0.08), transparent 46%),
        var(--panel);
      padding: 32px;
      box-shadow:
        0 0 0 1px hsl(var(--primary) / 0.08),
        0 24px 80px rgba(0, 0, 0, 0.38),
        0 0 34px hsl(var(--primary) / 0.12);
      backdrop-filter: blur(18px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    p { margin: 0 0 12px; color: var(--soft-text); line-height: 1.5; }
    .meta {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px 12px;
      margin-top: 14px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid hsl(var(--border) / 0.12);
      background: var(--panel-strong);
      font-size: 0.95rem;
    }
    .meta dt {
      color: var(--text);
      font-weight: 600;
      margin: 0;
    }
    .meta dd {
      margin: 0;
      color: var(--soft-text);
      word-break: break-word;
    }
    .status {
      margin-top: 8px;
      border: 1px solid hsl(var(--border) / 0.12);
      border-radius: 10px;
      background: var(--panel-strong);
      padding: 10px 12px;
      color: var(--soft-text);
      font-size: 0.95rem;
    }
    .status.warn {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      border: 1px solid hsl(var(--border) / 0.14);
      color: var(--text);
      transition: opacity 0.2s, transform 0.1s, border-color 0.2s, box-shadow 0.2s;
    }
    a:hover {
      border-color: hsl(var(--glow-blue) / 0.42);
      opacity: 0.94;
    }
    a:active { transform: scale(0.99); }
    .primary {
      border: none;
      background: linear-gradient(90deg, hsl(var(--primary) / 0.9), hsl(var(--glow-blue) / 0.72));
      color: var(--text);
      box-shadow: 0 12px 30px hsl(var(--primary) / 0.18);
    }
    .primary:hover {
      box-shadow: 0 16px 34px hsl(var(--primary) / 0.24), 0 0 24px hsl(var(--glow-blue) / 0.14);
    }
    code {
      background: var(--panel-strong);
      border: 1px solid hsl(var(--border) / 0.12);
      border-radius: 6px;
      padding: 2px 6px;
      color: var(--text);
    }
    .back-link {
      position: fixed;
      top: 20px;
      left: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      padding: 0;
      border-radius: 0;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); border-color: transparent; box-shadow: none; }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: block;
      box-shadow: 0 0 20px hsl(var(--primary) / 0.22), 0 0 28px hsl(var(--glow-blue) / 0.14);
    }
    @media (max-width: 640px) {
      .card { padding: 28px 20px; }
      .meta { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .actions a { text-align: center; }
      .back-link { position: static; margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="/pricing">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>
  <main class="card">
    <div class="logo-wrap">
      <img class="logo-icon" src="/icons/app-icon-192.png" alt="" />
    </div>
    <h1>Download HabitGlo for Windows</h1>
    <p id="greeting">Install and run the latest desktop build.</p>
    <p id="status" class="status">Loading download metadata...</p>
    <dl class="meta">
      <dt>Version</dt>
      <dd id="version">-</dd>
      <dt>File</dt>
      <dd id="filename">-</dd>
      <dt>Minimum OS</dt>
      <dd id="min-os">-</dd>
      <dt>SHA-256</dt>
      <dd id="sha256">-</dd>
    </dl>
    <div class="actions">
      <a id="download-link" class="primary" href="#">Download Installer</a>
      <a href="/">Back to Home</a>
      <a href="/pricing">Back to Pricing</a>
      <a href="/app?demoReset=1">Try in Browser</a>
    </div>
  </main>
  <script>
    (function () {
      const config = window.HABITGLO_WEBSITE_CONFIG || {};
      const windows = config.download && config.download.windows ? config.download.windows : {};
      const releasePageUrl = typeof windows.releasePageUrl === 'string' && windows.releasePageUrl.trim()
        ? windows.releasePageUrl.trim()
        : 'https://github.com/YOUR_ORG/YOUR_REPO/releases/latest';
      const directUrl = typeof windows.directUrl === 'string' ? windows.directUrl.trim() : '';
      const version = typeof windows.version === 'string' && windows.version.trim() ? windows.version.trim() : 'unknown';
      const fileName = typeof windows.fileName === 'string' && windows.fileName.trim() ? windows.fileName.trim() : 'HabitGlo installer';
      const minOs = typeof windows.minOs === 'string' && windows.minOs.trim() ? windows.minOs.trim() : 'Windows 10+';
      const sha = typeof windows.sha256 === 'string' && windows.sha256.trim() ? windows.sha256.trim() : 'Not published';

      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan');
      const greeting = document.getElementById('greeting');
      if (plan === 'monthly') {
        greeting.textContent = 'Thanks for subscribing. Download the latest Windows build below.';
      } else if (plan === 'lifetime') {
        greeting.textContent = 'Thanks for your lifetime purchase. Download the latest Windows build below.';
      }

      document.getElementById('version').textContent = version;
      document.getElementById('filename').textContent = fileName;
      document.getElementById('min-os').textContent = minOs;
      document.getElementById('sha256').textContent = sha;

      const downloadLink = document.getElementById('download-link');
      const status = document.getElementById('status');

      if (directUrl) {
        downloadLink.href = directUrl;
        status.textContent = 'Direct installer link is configured.';
        return;
      }

      downloadLink.href = releasePageUrl;
      downloadLink.textContent = 'Open Release Page';
      status.classList.add('warn');
      status.innerHTML = 'No direct installer URL configured. Set <code>download.windows.directUrl</code> in <code>public/download/config.js</code>.';
    })();
  </script>
</body>
</html>
